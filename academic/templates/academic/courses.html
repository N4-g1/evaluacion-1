{% extends 'academic/base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
  <div class="card-body">
    <h2 class="h4 mb-3">Crear curso</h2>
    <form id="course-form">
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label for="course-name" class="form-label">Nombre del curso</label>
          <input type="text" class="form-control" id="course-name" name="name" required>
        </div>
        <div class="col-md-5">
          <label for="course-teacher" class="form-label">Docente</label>
          <select class="form-select" id="course-teacher" name="teacher_id" required>
            <option value="">Selecciona un docente</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body">
    <h2 class="h4 mb-3">Cursos</h2>
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Curso</th>
          <th>Docente</th>
        </tr>
      </thead>
      <tbody id="courses-table-body"></tbody>
    </table>
  </div>
</div>

<script>
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

async function loadTeachers() {
  const response = await fetch('/api/teachers/');
  const data = await response.json();
  const rows = data.results || data;
  const select = document.getElementById('course-teacher');

  rows.forEach(teacher => {
    const option = document.createElement('option');
    option.value = teacher.id;
    option.textContent = `${teacher.first_name} ${teacher.last_name}`;
    select.appendChild(option);
  });
}

async function loadCourses() {
  const response = await fetch('/api/courses/');
  const data = await response.json();
  const rows = data.results || data;
  const tbody = document.getElementById('courses-table-body');

  tbody.innerHTML = '';

  rows.forEach(course => {
    const teacher = course.teacher ? `${course.teacher.first_name} ${course.teacher.last_name}` : 'Sin docente';
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${course.id}</td>
      <td>${course.name}</td>
      <td>${teacher}</td>
    `;
    tbody.appendChild(row);
  });
}

document.getElementById('course-form').addEventListener('submit', async function (event) {
  event.preventDefault();

  const name = document.getElementById('course-name').value.trim();
  const teacherId = document.getElementById('course-teacher').value;

  if (!name || !teacherId) {
    alert('Completa el nombre del curso y selecciona un docente.');
    return;
  }

  const response = await fetch('/api/courses/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken')
    },
    body: JSON.stringify({
      name: name,
      teacher_id: Number(teacherId)
    })
  });

  if (response.ok) {
    document.getElementById('course-form').reset();
    loadCourses();
  } else {
    const data = await response.json();
    alert(data.detail || JSON.stringify(data));
  }
});

loadTeachers();
loadCourses();
</script>
{% endblock %}
